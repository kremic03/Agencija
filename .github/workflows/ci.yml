# Provere uz svaki push na main i svaki pull request: lint, tipovi i Playwright testovi.
# Testovi koriste lažni Resend (playwright.config.ts), pa nijedan pravi mejl ne odlazi
# i nisu potrebne nikakve tajne.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      # Testovi traže Google Chrome (channel: "chrome"); runner ga ima, ovo ga samo osigurava
      - name: Google Chrome
        run: npx playwright install --with-deps chrome

      - name: Testovi
        run: npm test

      - name: Izveštaj kada testovi padnu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
